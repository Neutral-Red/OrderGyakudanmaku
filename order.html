<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTROPY CORE - Perfect Order</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010103;
            font-family: 'Courier New', Courier, monospace;
            user-select: none; color: #00f2ff;
        }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .panel {
            position: absolute; padding: 15px;
            background: rgba(0, 5, 10, 0.9);
            border: 1px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }
        
        #top-left { top: 20px; left: 20px; width: 280px; }
        #bottom-center { bottom: 20px; left: 50%; transform: translateX(-50%); width: 400px; text-align: center; }
        
        /* Overdrive Bar */
        .gauge-container { width: 100%; height: 12px; background: #001520; border: 1px solid #00f2ff; margin-top: 8px; position: relative; }
        #overdrive-fill { width: 0%; height: 100%; background: #00f2ff; transition: width 0.1s; box-shadow: 0 0 10px #00f2ff; }
        #overdrive-ready { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; opacity: 0; animation: pulse 1s infinite; display: none; 
        }

        @keyframes pulse { 0% { opacity: 0; } 50% { opacity: 0.5; } 100% { opacity: 0; } }
        
        .hp-bar { width: 100%; height: 8px; background: #1a0000; border: 1px solid #ff0055; margin: 5px 0; }
        #hp-fill { width: 100%; height: 100%; background: #ff0055; }
        
        .protocol-tag { font-size: 18px; font-weight: bold; letter-spacing: 3px; }
        .overdrive-active { border-color: #fff !important; color: #fff !important; box-shadow: 0 0 30px #fff !important; }
        .overdrive-text { color: #fff; text-shadow: 0 0 10px #fff; font-size: 20px; display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="ui-layer">
    <div id="top-left" class="panel">
        <div style="font-weight: bold; font-size: 11px;">INTEGRITY</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        
        <div style="font-weight: bold; font-size: 11px; margin-top: 15px;">POTENTIAL_GAUGE</div>
        <div class="gauge-container">
            <div id="overdrive-fill"></div>
            <div id="overdrive-ready"></div>
        </div>
        <div id="instruction" style="font-size: 9px; margin-top: 5px; color: #666;">ERASE CHAOS TO CHARGE // LEFT-CLICK TO ACTIVATE</div>
    </div>

    <div id="bottom-center" class="panel">
        <div id="od-label" class="overdrive-text">:: PERFECT ORDER ::</div>
        <div id="active-protocol-name" class="protocol-tag">--</div>
        <div style="font-size: 9px; color: #00f2ff; margin-top: 5px; opacity: 0.7;">SCROLL TO SWITCH PROTOCOL</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * WEAPON DATA
 * Each protocol now has a "Normal" and "Overdrive" stream count.
 */
const protocols = [
    { name: "Shatter-Star", streams: 6, odStreams: 32, rate: 10, speed: 5, angleOff: 15, life: 2.5, type: "straight" },
    { name: "Vortex-Grip", streams: 2, odStreams: 12, rate: 20, speed: 4, angleOff: 80, life: 4, type: "spiral", curve: 0.01, accel: 0.0006 },
    { name: "Neutron-Beam", streams: 1, odStreams: 8, rate: 60, speed: 18, angleOff: 0, life: 0.5, type: "laser" },
    { name: "Orbit-Guard", streams: 4, odStreams: 20, rate: 12, speed: 3, angleOff: 40, life: 6, type: "curved", curve: 0.04 }
];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let width, height, lastTime = 0, patternClock = 0, elapsedTime = 0;
let mouse = { x: 0, y: 0 };
let activeIdx = 0;

// System State
let hp = 1000, maxHp = 1000;
let potential = 0; // 0 to 100
let isOverdrive = false;
let overdriveTimer = 0;

class Bullet {
    constructor() { this.active = false; }
    spawn(x, y, angle, cfg, od) {
        this.active = true;
        this.x = x; this.y = y;
        this.angle = angle;
        this.speed = cfg.speed * (od ? 1.5 : 1);
        this.type = cfg.type;
        this.curve = cfg.curve || 0;
        this.accel = cfg.accel || 0;
        this.life = cfg.life;
        this.od = od;
    }
    update(dt) {
        if (!this.active) return;
        if (this.type === "curved") this.angle += this.curve;
        if (this.type === "spiral") { this.curve += this.accel; this.angle += this.curve; }
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.life -= dt;
        if (this.life <= 0) this.active = false;
    }
    draw() {
        ctx.fillStyle = this.od ? "#fff" : "#00f2ff";
        if (this.od) ctx.shadowBlur = 10, ctx.shadowColor = "#fff";
        const sz = this.od ? 6 : 4;
        ctx.fillRect(this.x - sz/2, this.y - sz/2, sz, sz);
        ctx.shadowBlur = 0;
    }
}

class Enemy {
    constructor() { this.active = false; }
    spawn() {
        this.active = true;
        this.hp = 8 + (elapsedTime / 10);
        const side = Math.floor(Math.random() * 4);
        if (side === 0) { this.x = Math.random() * width; this.y = -50; }
        else if (side === 1) { this.x = width + 50; this.y = Math.random() * height; }
        else if (side === 2) { this.x = Math.random() * width; this.y = height + 50; }
        else { this.x = -50; this.y = Math.random() * height; }
        this.speed = 1.5 + (elapsedTime / 100);
        this.size = 15;
    }
    update(playerX, playerY) {
        const dx = playerX - this.x, dy = playerY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        this.x += (dx/dist) * this.speed;
        this.y += (dy/dist) * this.speed;
        if (dist < 40) { takeDamage(100); this.active = false; }
    }
    draw() {
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x - 10, this.y - 10, 20, 20);
    }
}

const bullets = Array.from({ length: 3000 }, () => new Bullet());
const enemies = Array.from({ length: 50 }, () => new Enemy());

function takeDamage(v) {
    if (isOverdrive) return; // Invulnerable during overdrive
    hp -= v;
    if (hp <= 0) hp = 0;
    document.getElementById('hp-fill').style.width = (hp/maxHp*100) + "%";
}

function update(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    if (hp <= 0) return drawGameOver();

    elapsedTime += dt;
    patternClock += dt;

    // Overdrive logic
    if (isOverdrive) {
        overdriveTimer -= dt;
        if (overdriveTimer <= 0) {
            isOverdrive = false;
            document.getElementById('bottom-center').classList.remove('overdrive-active');
            document.getElementById('od-label').style.display = "none";
            potential = 0;
        }
    }

    // UI Updates
    const fill = document.getElementById('overdrive-fill');
    const ready = document.getElementById('overdrive-ready');
    fill.style.width = potential + "%";
    ready.style.display = potential >= 100 ? "block" : "none";

    // Player firing
    const p = protocols[activeIdx];
    const streamCount = isOverdrive ? p.odStreams : p.streams;
    const currentRate = isOverdrive ? p.rate * 1.5 : p.rate;
    
    if (!this.lastFire) this.lastFire = 0;
    if (patternClock - this.lastFire > 1/currentRate) {
        const step = (Math.PI * 2) / streamCount;
        for (let i = 0; i < streamCount; i++) {
            const angle = (patternClock * (p.angleOff || 0) * (Math.PI/180)) + (i * step);
            const b = bullets.find(nb => !nb.active);
            if (b) b.spawn(mouse.x, mouse.y, angle, p, isOverdrive);
        }
        this.lastFire = patternClock;
    }

    // Enemy Spawning (Lowered frequency)
    if (Math.random() < 0.03) {
        const e = enemies.find(ne => !ne.active);
        if (e) e.spawn();
    }

    // Physics
    bullets.forEach(b => {
        if (!b.active) return;
        b.update(dt);
        enemies.forEach(e => {
            if (e.active && Math.hypot(b.x - e.x, b.y - e.y) < 20) {
                e.hp -= (isOverdrive ? 10 : 1);
                b.active = false;
                if (e.hp <= 0) {
                    e.active = false;
                    if (!isOverdrive) potential = Math.min(100, potential + 4);
                }
            }
        });
    });

    enemies.forEach(e => { if (e.active) e.update(mouse.x, mouse.y); });

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.fillStyle = isOverdrive ? "rgba(10, 10, 20, 0.4)" : "rgba(1, 1, 3, 0.3)";
    ctx.fillRect(0, 0, width, height);
    
    bullets.forEach(b => { if (b.active) b.draw(); });
    enemies.forEach(e => { if (e.active) e.draw(); });

    // Draw Hex Core
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.rotate(elapsedTime);
    ctx.strokeStyle = isOverdrive ? "#fff" : "#00f2ff";
    ctx.lineWidth = isOverdrive ? 5 : 2;
    if (isOverdrive) { ctx.shadowBlur = 20; ctx.shadowColor = "#fff"; }
    ctx.beginPath();
    for(let i=0; i<6; i++) {
        const a = (i/6) * Math.PI * 2;
        ctx.lineTo(Math.cos(a)*30, Math.sin(a)*30);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
    
    document.getElementById('active-protocol-name').innerText = protocols[activeIdx].name;
}

function drawGameOver() {
    ctx.fillStyle = "black"; ctx.fillRect(0,0,width,height);
    ctx.fillStyle = "red"; ctx.textAlign = "center"; ctx.font = "30px Courier";
    ctx.fillText("ORDER COLLAPSED", width/2, height/2);
}

/** INPUTS */
window.addEventListener('mousedown', e => {
    if (e.button === 0) { // Left Click
        if (potential >= 100 && !isOverdrive) {
            isOverdrive = true;
            overdriveTimer = 6;
            document.getElementById('bottom-center').classList.add('overdrive-active');
            document.getElementById('od-label').style.display = "block";
        }
    } else if (e.button === 2) { // Right Click
        activeIdx = (activeIdx + 1) % protocols.length;
    }
});

window.addEventListener('wheel', () => {
    activeIdx = (activeIdx + 1) % protocols.length;
});

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

width = canvas.width = window.innerWidth;
height = canvas.height = window.innerHeight;
requestAnimationFrame(update);
</script>
</body>
</html>
